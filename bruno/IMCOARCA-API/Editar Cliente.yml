info:
  name: Editar Cliente
  type: http
  seq: 6

http:
  method: PUT
  url: "{{base_url}}/clients/{{client_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente Prueba EDITADO",
        "cuit": "20123456789",
        "email": "cliente.editado@testing.com",
        "phone": "+56912345678",
        "tax": "I",
        "retieniva": true
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
