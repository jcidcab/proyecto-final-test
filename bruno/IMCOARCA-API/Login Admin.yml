info:
  name: Login Admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email_admin}}",
        "password": "{{pass_admin}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.body.access_token;
        if (token) {
          bru.setEnvVar("token", token);
          bru.setVar("token", token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
